name: Build EstatePilot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract EstatePilot source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source build_app
          mkdir -p source

          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'EstatePilot_Phase1_Source*.zip' | head -n 1)"
          test -n "$ZIP_FILE"
          echo "Using source: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d source
          test -f source/EstatePilot/pubspec.yaml
          test -f source/EstatePilot/lib/main.dart

      - name: Pin compatible file_picker
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/^([[:space:]]*)file_picker:[[:space:]].*/\1file_picker: 10.3.10/' source/EstatePilot/pubspec.yaml
          grep -n 'file_picker:' source/EstatePilot/pubspec.yaml

      - name: Create fresh Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.estatepilot \
            --project-name app \
            build_app

      - name: Copy EstatePilot files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_app/lib
          cp -R source/EstatePilot/lib build_app/lib
          cp source/EstatePilot/pubspec.yaml build_app/pubspec.yaml

          if [ -f "source/EstatePilot/analysis_options.yaml" ]; then
            cp source/EstatePilot/analysis_options.yaml build_app/analysis_options.yaml
          fi

          if [ -d "source/EstatePilot/test" ]; then
            rm -rf build_app/test
            cp -R source/EstatePilot/test build_app/test
          fi

          if [ -d "source/EstatePilot/android/app/src/main" ]; then
            rm -rf build_app/android/app/src/main
            cp -R source/EstatePilot/android/app/src/main build_app/android/app/src/main
          fi

      - name: Get packages
        working-directory: build_app
        run: flutter pub get

      - name: Run tests
        working-directory: build_app
        run: flutter test

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          cp build_app/build/app/outputs/flutter-apk/app-release.apk EstatePilot.apk
          test -s EstatePilot.apk
          ls -lh EstatePilot.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstatePilot-APK
          path: EstatePilot.apk
          if-no-files-found: error
          retention-days: 30
