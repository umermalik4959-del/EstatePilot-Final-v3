name: Build EstatePilot APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source
        run: |
          mkdir source
          unzip -q "EstatePilot_Phase1_Source (2).zip" -d source

      - name: Create Flutter project
        run: |
          flutter create --platforms=android --org com.estatepilot --project-name app build_app

      - name: Copy app files
        run: |
          rm -rf build_app/lib
          cp -R source/EstatePilot/lib build_app/lib
          cp source/EstatePilot/pubspec.yaml build_app/pubspec.yaml

          if [ -d "source/EstatePilot/test" ]; then
            rm -rf build_app/test
            cp -R source/EstatePilot/test build_app/test
          fi

          if [ -d "source/EstatePilot/android/app/src/main" ]; then
            rm -rf build_app/android/app/src/main
            cp -R source/EstatePilot/android/app/src/main build_app/android/app/src/main
          fi

      - name: Get packages
        working-directory: build_app
        run: flutter pub get

      - name: Test
        working-directory: build_app
        run: flutter test

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EstatePilot-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
